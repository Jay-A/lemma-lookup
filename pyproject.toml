[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lemma-lookup"
version = "0.1.0"
description = "Minimal German lemma lookup API using Django and spaCy."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "Django>=5.2,<6.0",
    "django-cors-headers>=4.7,<5.0",
    "spacy>=3.8,<4.0",
    "gunicorn>=23,<24",
]

[tool.setuptools]
py-modules = []
